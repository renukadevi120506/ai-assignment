{% extends "base.html" %}

{% block title %}Sign In - AI Education Assessment{% endblock %}
{% block page_title %}Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center pt-4">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm p-4">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock text-primary display-4"></i>
                <h3 class="fw-bold mt-2">Welcome Back</h3>
                <p class="text-muted small">Access your grading or learning workspace</p>
            </div>
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username or Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username_or_email" class="form-control" placeholder="Enter username or email" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" name="remember" class="form-check-input" id="rememberCheck">
                    <label class="form-check-label small" for="rememberCheck">Remember me</label>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>
            <div class="text-center mt-4 border-top pt-3">
                <p class="small text-muted mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
