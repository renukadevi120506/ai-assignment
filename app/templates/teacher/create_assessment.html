{% extends "base.html" %}

{% block title %}Create Assessment - Teacher Panel{% endblock %}
{% block page_title %}Create New Assessment{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm p-4">
            <h5 class="fw-bold mb-3 border-bottom pb-2">Assessment Details</h5>
            <form method="POST" action="{{ url_for('assessment.create') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Assessment Title</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g. Midterm Assessment: Modern AI & Information Retrieval" required autofocus>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Subject</label>
                        <input type="text" name="subject" class="form-control" placeholder="e.g. Artificial Intelligence" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Topic</label>
                        <input type="text" name="topic" class="form-control" placeholder="e.g. Retrieval-Augmented Generation" required>
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Maximum Marks</label>
                        <input type="number" step="1" min="1" max="100" name="maximum_marks" class="form-control" value="10" required>
                        <small class="text-muted">The rubric criteria must sum up to this value.</small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Due Date (Optional)</label>
                        <input type="date" name="due_date" class="form-control">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Descriptive Question</label>
                    <textarea name="question_text" class="form-control" rows="5" placeholder="Enter the detailed descriptive question prompt for students..." required></textarea>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <a href="{{ url_for('assessment.list_assessments') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">
                        Create Assessment & Configure Rubric <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
